name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"

jobs:
  find:
    name: Find apps
    runs-on: ubuntu-latest
    outputs:
      addons: ${{ steps.addons.outputs.addons_list }}
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7.0.0

      - name: 🔍 Find app directories
        id: addons
        uses: home-assistant/actions/helpers/find-addons@master

  lint:
    name: Lint app ${{ matrix.path }}
    runs-on: ubuntu-latest
    needs: find
    strategy:
      matrix:
        path: ${{ fromJson(needs.find.outputs.addons) }}
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7.0.0

      - name: 🚀 Run Home Assistant App Lint
        uses: frenck/action-addon-linter@v2.21
        with:
          path: "./${{ matrix.path }}"

  hadolint:
    name: hadolint
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7.0.0

      - name: 🐳 Run hadolint
        run: |
          shopt -s globstar
          for dockerfile in **/Dockerfile; do
            echo "Linting: ${dockerfile}"
            docker run --rm -i \
              -v "$(pwd)/.hadolint.yaml:/.hadolint.yaml:ro" \
              hadolint/hadolint:v2.12.0 < "${dockerfile}"
          done

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7.0.0

      - name: 🐚 Run shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          additional_files: >-
            app-actualbudget/rootfs/etc/cont-init.d/00-validate.sh
            app-actualbudget/rootfs/etc/services.d/actualbudget/run
            app-actualbudget/rootfs/etc/services.d/actualbudget/finish
            app-actualbudget/rootfs/usr/share/actualbudget/config.sh

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7.0.0

      - name: 🔎 Run actionlint
        uses: raven-actions/actionlint@v2

  version-check:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7.0.0

      - name: 🔎 Validate config/changelog version
        run: |
          config_version="$(grep -E '^version:' app-actualbudget/config.yaml | head -n 1 | sed -E "s/version:[[:space:]]*\"?([^\"[:space:]]+)\"?/\1/")"
          changelog_version="$(grep -E '^## ' app-actualbudget/CHANGELOG.md | head -n 1 | sed -E 's/^##[[:space:]]*//')"

          echo "Config version: ${config_version}"
          echo "Changelog version: ${changelog_version}"

          if [[ "${config_version}" != "${changelog_version}" ]]; then
            echo "Version mismatch between config.yaml and CHANGELOG.md"
            exit 1
          fi

  actual-image-version-check:
    name: Actual image version consistency
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7.0.0

      - name: 🔎 Validate Actual server image pins
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          dockerfile = Path("app-actualbudget/Dockerfile")
          build_yaml = Path("app-actualbudget/build.yaml")

          docker_match = re.search(
              r"ARG BUILD_FROM=docker\.io/actualbudget/actual-server:([0-9]+\.[0-9]+\.[0-9]+)",
              dockerfile.read_text(encoding="utf-8"),
          )
          if docker_match is None:
              raise SystemExit("Dockerfile Actual server image pin is missing")

          actual_version = docker_match.group(1)
          expected_image = f"docker.io/actualbudget/actual-server:{actual_version}"
          build_text = build_yaml.read_text(encoding="utf-8")

          if build_text.count(expected_image) != 2:
              raise SystemExit(
                  "build.yaml Actual server image pins must match Dockerfile for both architectures"
              )
          PY
