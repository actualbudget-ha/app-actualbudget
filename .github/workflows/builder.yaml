name: Builder

env:
  MONITORED_FILES: "build.yaml config.json config.yaml config.yml Dockerfile rootfs translations"
  REPOSITORY_MONITORED_FILES: "repository.yaml .github/workflows/builder.yaml .github/workflows/build-app.yaml"

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish built images to registry"
        required: false
        default: false
        type: boolean
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  init:
    name: Initialize builds
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
      changed_apps: ${{ steps.filter.outputs.changed_apps }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      - name: Get changed files
        id: changed_files
        uses: tj-actions/changed-files@v47

      - name: Find app directories
        id: apps
        uses: home-assistant/actions/helpers/find-addons@master

      - name: Filter changed apps
        id: filter
        env:
          APPS: ${{ steps.apps.outputs.addons }}
          CHANGED_FILES: ${{ steps.changed_files.outputs.all_changed_files }}
          REPOSITORY_MONITORED_FILES: ${{ env.REPOSITORY_MONITORED_FILES }}
        run: |
          read -r -a apps <<< "${APPS}"
          read -r -a monitored_files <<< "${MONITORED_FILES}"
          read -r -a repository_monitored_files <<< "${REPOSITORY_MONITORED_FILES}"
          changed_apps=()

          # For manual runs, rebuild all apps.
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            changed_apps=("${apps[@]}")
          # If repository-level build metadata changed, rebuild all apps.
          else
            for file in "${repository_monitored_files[@]}"; do
              if [[ " ${CHANGED_FILES} " == *" ${file} "* ]]; then
                changed_apps=("${apps[@]}")
                break
              fi
            done
          fi

          if [[ ${#changed_apps[@]} -eq 0 ]]; then
            for app in "${apps[@]}"; do
              for file in "${monitored_files[@]}"; do
                if [[ "${CHANGED_FILES}" =~ ${app}/${file} ]]; then
                  changed_apps+=("${app}")
                  break
                fi
              done
            done
          fi

          if [[ ${#changed_apps[@]} -gt 0 ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "changed_apps=$(jq -nc '$ARGS.positional' --args "${changed_apps[@]}")" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  build-app:
    name: Build ${{ matrix.app }}
    needs: init
    if: needs.init.outputs.changed == 'true'
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.init.outputs.changed_apps) }}
    uses: ./.github/workflows/build-app.yaml
    with:
      app: ${{ matrix.app }}
      publish: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    secrets: inherit
