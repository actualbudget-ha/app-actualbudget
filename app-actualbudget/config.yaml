---
version: 0.1.9
slug: app-actualbudget
name: Actual Budget
description: Self-hosted Actual Budget server for Home Assistant.
url: https://github.com/actualbudget-ha/app-actualbudget/tree/main/app-actualbudget
arch:
  - aarch64
  - amd64
image: ghcr.io/actualbudget-ha/app-actualbudget
stage: experimental
startup: services
init: false
