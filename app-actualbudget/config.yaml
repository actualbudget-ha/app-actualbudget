  https_key: ""
  https_cert: ""
  log_level: info
  extra_env_vars: []
schema:
  port: port?
  hostname: str?
  upload_file_sync_size_limit_mb: int?
  upload_sync_encrypted_file_sync_size_limit_mb: int?
  upload_file_size_limit_mb: int?
  https_key: str?
  https_cert: str?
  log_level: list(debug|info|warning|error)?
  extra_env_vars:
    - "match(^[A-Za-z_][A-Za-z0-9_]*=.*$)?"
